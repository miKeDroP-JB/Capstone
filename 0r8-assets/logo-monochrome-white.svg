<?xml version="1.0" encoding="UTF-8"?>
<!--
  0r8 MONOCHROME WHITE LOGO
  Single color version for dark backgrounds
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Connection Lines -->
  <g stroke-width="1" fill="none" stroke="#FFFFFF" opacity="0.4">
    <line x1="100" y1="40" x2="100" y2="85"/>
    <line x1="45" y1="145" x2="80" y2="110"/>
    <line x1="155" y1="145" x2="120" y2="110"/>
  </g>

  <!-- NOUS Symbol ☿ (Mercury) - Top -->
  <text x="100" y="35" text-anchor="middle" font-size="28" fill="#FFFFFF" font-family="serif">☿</text>

  <!-- ANIMA Symbol 🜍 (Sulfur) - Bottom Left -->
  <text x="40" y="160" text-anchor="middle" font-size="28" fill="#FFFFFF" font-family="serif">🜍</text>

  <!-- HOLOS Symbol 🜔 (Salt) - Bottom Right -->
  <text x="160" y="160" text-anchor="middle" font-size="28" fill="#FFFFFF" font-family="serif">🜔</text>

  <!-- Unified Symbol ☉ (Sun/Gold) - Center -->
  <text x="100" y="110" text-anchor="middle" font-size="36" fill="#FFFFFF" font-family="serif">☉</text>
</svg>
