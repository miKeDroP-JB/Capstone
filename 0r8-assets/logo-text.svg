<?xml version="1.0" encoding="UTF-8"?>
<!--
  0r8 TEXT LOGO
  Brand name only with gradient
  For headers, navigation, text-only contexts
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#8B5CF6" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Brand Name -->
  <text x="100" y="45" text-anchor="middle" font-size="48" font-weight="700" fill="url(#text-gradient)" font-family="Cinzel, serif" letter-spacing="0.1em" filter="url(#text-glow)">0r8</text>
</svg>
